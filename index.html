<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Змейка</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #130a21; /* Очень темный фиолетовый */
            --panel-bg: #2a1648;
            --snake-color: #4ade80;
            --text-color: #e2e8f0;
        }

        body {
            margin: 0; padding: 0; background-color: var(--bg-color);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; overflow: hidden; touch-action: none; font-family: sans-serif; color: var(--text-color);
        }

        canvas { 
            background-color: #1e1033; /* Чуть светлее фона для контраста */
            border-radius: 16px; 
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.2); 
            border: 2px solid #4c1d95;
            margin-bottom: 10px;
        }
        
        /* Информационная панель */
        #ui-panel { 
            display: flex; justify-content: space-between; width: 300px; 
            margin-bottom: 15px; font-size: 18px; font-weight: bold; 
        }
        .ui-item { 
            background: var(--panel-bg); padding: 8px 15px; border-radius: 8px; 
            border: 1px solid #6b21a8; box-shadow: 0 0 10px rgba(107, 33, 168, 0.3);
        }
        #level-text { color: #c084fc; }
        #apples-text { color: #f87171; }
        
        /* Экран победы/поражения */
        #game-over {
            position: absolute; display: none; flex-direction: column; align-items: center;
            background: rgba(19, 10, 33, 0.95); padding: 30px; border: 2px solid #9333ea; border-radius: 15px;
            box-shadow: 0 0 30px rgba(147, 51, 234, 0.4); z-index: 2000; text-align: center;
        }
        #game-over h2 { color: #f87171; margin: 0 0 15px 0; }
        #game-over button { 
            padding: 12px 24px; font-size: 18px; background: #9333ea; color: #fff; 
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer; 
            box-shadow: 0 0 15px rgba(147, 51, 234, 0.5);
        }

        /* D-PAD (Крестовина) */
        .dpad {
            display: grid;
            grid-template-columns: 60px 60px 60px;
            grid-template-rows: 60px 60px 60px;
            gap: 5px;
            touch-action: none;
        }
        .dpad-btn {
            background: rgba(147, 51, 234, 0.15);
            border: 2px solid #9333ea;
            border-radius: 12px;
            display: flex; justify-content: center; align-items: center;
            font-size: 28px; color: #c084fc; cursor: pointer;
            user-select: none; -webkit-user-select: none; transition: all 0.1s;
        }
        .dpad-btn:active, .dpad-btn.pressed { 
            background: rgba(147, 51, 234, 0.6); color: #fff; 
            box-shadow: 0 0 15px rgba(147, 51, 234, 0.8);
        }
        .dpad-up { grid-column: 2; grid-row: 1; }
        .dpad-left { grid-column: 1; grid-row: 2; }
        .dpad-right { grid-column: 3; grid-row: 2; }
        .dpad-down { grid-column: 2; grid-row: 3; }
    </style>
</head>
<body>
    <div id="ui-panel">
        <div class="ui-item" id="level-text">Уровень: 1</div>
        <div class="ui-item" id="apples-text">🍎 0/15</div>
    </div>

    <canvas id="gameCanvas" width="300" height="300"></canvas>
    
    <!-- D-PAD -->
    <div class="dpad">
        <div class="dpad-btn dpad-up" id="btn-up">▲</div>
        <div class="dpad-btn dpad-left" id="btn-left">◀</div>
        <div class="dpad-btn dpad-right" id="btn-right">▶</div>
        <div class="dpad-btn dpad-down" id="btn-down">▼</div>
    </div>

    <div id="game-over">
        <h2 id="go-title">ВЫ ПРОИГРАЛИ</h2>
        <button onclick="location.reload()">ЗАНОВО</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const levelEl = document.getElementById('level-text');
        const applesEl = document.getElementById('apples-text');
        
        const gridSize = 15;
        const tileCount = canvas.width / gridSize;

        let snake = [{x: 10, y: 10}];
        let food = {x: 15, y: 15};
        let obstacles = [];
        let dx = 0, dy = 0;
        let nextDx = 0, nextDy = 0;
        
        let level = 1;
        const maxLevel = 15;
        let applesCollected = 0;
        let applesGoal = 15;
        
        let speed = 230; 
        let gameLoop;

        function updateUI() {
            levelEl.innerText = `Уровень: ${level}`;
            applesEl.innerText = `🍎 ${applesCollected}/${applesGoal}`;
        }

        function generateFood() {
            let newFood;
            while (true) {
                newFood = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
                const inSnake = snake.some(seg => seg.x === newFood.x && seg.y === newFood.y);
                const inObs = obstacles.some(obs => obs.x === newFood.x && obs.y === newFood.y);
                if (!inSnake && !inObs) break;
            }
            food = newFood;
        }

        function generateObstacles() {
            obstacles = [];
            if (level === 1) return; 

            let count = Math.min(level * 2, 20); 
            for (let i = 0; i < count; i++) {
                let obs;
                while (true) {
                    obs = {
                        x: Math.floor(Math.random() * tileCount),
                        y: Math.floor(Math.random() * tileCount)
                    };
                    const inSnake = snake.some(seg => seg.x === obs.x && seg.y === obs.y);
                    const inFood = (obs.x === food.x && obs.y === food.y);
                    const nearCenter = (Math.abs(obs.x - 10) < 3 && Math.abs(obs.y - 10) < 3);
                    const inObs = obstacles.some(o => o.x === obs.x && o.y === obs.y);
                    
                    if (!inSnake && !inFood && !nearCenter && !inObs) break;
                }
                obstacles.push(obs);
            }
        }

        // --- РЕАЛИСТИЧНАЯ ОТРИСОВКА ---
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Сетка (едва заметная)
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.02)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= tileCount; i++) {
                ctx.beginPath(); ctx.moveTo(i * gridSize, 0); ctx.lineTo(i * gridSize, canvas.height); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i * gridSize); ctx.lineTo(canvas.width, i * gridSize); ctx.stroke();
            }

            // Баррикады (Фиолетовые кристаллы)
            obstacles.forEach(obs => {
                ctx.fillStyle = '#4c1d95';
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#9333ea';
                ctx.beginPath();
                ctx.roundRect(obs.x * gridSize + 1, obs.y * gridSize + 1, gridSize - 2, gridSize - 2, 4);
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            // Еда (Реалистичное яблоко)
            const fx = food.x * gridSize + gridSize/2;
            const fy = food.y * gridSize + gridSize/2;
            
            // Тень яблока
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.ellipse(fx, fy + 4, gridSize/2 - 2, 3, 0, 0, Math.PI*2);
            ctx.fill();

            // Тело яблока
            ctx.fillStyle = '#ef4444';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ef4444';
            ctx.beginPath();
            ctx.arc(fx, fy, gridSize/2 - 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Веточка и листик
            ctx.fillStyle = '#78350f';
            ctx.fillRect(fx - 1, fy - gridSize/2 + 1, 2, 4);
            ctx.fillStyle = '#22c55e';
            ctx.beginPath();
            ctx.ellipse(fx + 3, fy - gridSize/2 + 2, 3, 1.5, Math.PI/4, 0, Math.PI*2);
            ctx.fill();

            // --- ЗМЕЙКА (ПЛАВНАЯ ЛИНИЯ) ---
            ctx.beginPath();
            ctx.lineWidth = gridSize * 0.85;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            // Градиент от головы к хвосту
            let gradient = ctx.createLinearGradient(
                snake[0].x * gridSize, snake[0].y * gridSize, 
                snake[snake.length-1].x * gridSize, snake[snake.length-1].y * gridSize
            );
            gradient.addColorStop(0, '#4ade80'); // Ярко-зеленый (голова)
            gradient.addColorStop(1, '#166534'); // Темно-зеленый (хвост)

            ctx.strokeStyle = gradient;
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#4ade80';

            // Рисуем линию через все сегменты
            ctx.moveTo(snake[0].x * gridSize + gridSize/2, snake[0].y * gridSize + gridSize/2);
            for (let i = 1; i < snake.length; i++) {
                ctx.lineTo(snake[i].x * gridSize + gridSize/2, snake[i].y * gridSize + gridSize/2);
            }
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Голова и глаза
            const hx = snake[0].x * gridSize + gridSize/2;
            const hy = snake[0].y * gridSize + gridSize/2;
            
            // Глаза (зависят от направления)
            ctx.fillStyle = '#fff';
            let eye1 = {x: 0, y: 0}, eye2 = {x: 0, y: 0};
            
            if (dx === 1) { eye1 = {x: 3, y: -3}; eye2 = {x: 3, y: 3}; }
            else if (dx === -1) { eye1 = {x: -3, y: -3}; eye2 = {x: -3, y: 3}; }
            else if (dy === 1) { eye1 = {x: -3, y: 3}; eye2 = {x: 3, y: 3}; }
            else if (dy === -1) { eye1 = {x: -3, y: -3}; eye2 = {x: 3, y: -3}; }
            else { eye1 = {x: -3, y: -3}; eye2 = {x: 3, y: -3}; } // По умолчанию

            // Рисуем белки
            ctx.beginPath(); ctx.arc(hx + eye1.x, hy + eye1.y, 2.5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(hx + eye2.x, hy + eye2.y, 2.5, 0, Math.PI*2); ctx.fill();
            
            // Зрачки
            ctx.fillStyle = '#000';
            ctx.beginPath(); ctx.arc(hx + eye1.x + (dx*0.5), hy + eye1.y + (dy*0.5), 1.2, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(hx + eye2.x + (dx*0.5), hy + eye2.y + (dy*0.5), 1.2, 0, Math.PI*2); ctx.fill();

            // Язычок (только когда движется)
            if (dx !== 0 || dy !== 0) {
                ctx.strokeStyle = '#ef4444';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                if (dx === 1) { ctx.moveTo(hx + 7, hy); ctx.lineTo(hx + 11, hy); }
                else if (dx === -1) { ctx.moveTo(hx - 7, hy); ctx.lineTo(hx - 11, hy); }
                else if (dy === 1) { ctx.moveTo(hx, hy + 7); ctx.lineTo(hx, hy + 11); }
                else if (dy === -1) { ctx.moveTo(hx, hy - 7); ctx.lineTo(hx, hy - 11); }
                ctx.stroke();
            }
        }

        function update() {
            if (nextDx !== 0 || nextDy !== 0) {
                if (!(nextDx === -dx && nextDy === -dy)) {
                    dx = nextDx; dy = nextDy;
                }
            }

            if (dx === 0 && dy === 0) return;

            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) return endGame(false);
            if (snake.some(seg => seg.x === head.x && seg.y === head.y)) return endGame(false);
            if (obstacles.some(obs => obs.x === head.x && obs.y === head.y)) return endGame(false);

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                applesCollected++;
                updateUI();
                tg.HapticFeedback.impactOccurred('light');
                
                if (applesCollected >= applesGoal) {
                    levelUp();
                } else {
                    generateFood();
                }
            } else {
                snake.pop();
            }

            draw();
        }

        function levelUp() {
            clearInterval(gameLoop);
            
            if (level >= maxLevel) {
                return endGame(true);
            }

            level++;
            applesCollected = 0;
            applesGoal += 5;
            speed = Math.max(100, speed - 10); 
            
            updateUI();
            tg.HapticFeedback.notificationOccurred('success');
            
            snake = [{x: 10, y: 10}];
            dx = 0; dy = 0; nextDx = 0; nextDy = 0;
            
            generateObstacles();
            generateFood();
            draw();

            setTimeout(() => {
                gameLoop = setInterval(update, speed);
            }, 500);
        }

        function endGame(isWin) {
            clearInterval(gameLoop);
            const title = document.getElementById('go-title');
            if (isWin) {
                title.innerText = '🏆 ТЫ ПРОШЕЛ ВСЕ УРОВНИ!';
                title.style.color = '#4ade80';
            } else {
                title.innerText = 'ВЫ ПРОИГРАЛИ';
                title.style.color = '#ef4444';
            }
            document.getElementById('game-over').style.display = 'flex';
            tg.HapticFeedback.notificationOccurred(isWin ? 'success' : 'error');
        }

        // --- УПРАВЛЕНИЕ D-PAD ---
        function pressUp() { if (dy === 0) { nextDx = 0; nextDy = -1; } }
        function pressDown() { if (dy === 0) { nextDx = 0; nextDy = 1; } }
        function pressLeft() { if (dx === 0) { nextDx = -1; nextDy = 0; } }
        function pressRight() { if (dx === 0) { nextDx = 1; nextDy = 0; } }

        document.getElementById('btn-up').addEventListener('touchstart', e => { e.preventDefault(); pressUp(); });
        document.getElementById('btn-down').addEventListener('touchstart', e => { e.preventDefault(); pressDown(); });
        document.getElementById('btn-left').addEventListener('touchstart', e => { e.preventDefault(); pressLeft(); });
        document.getElementById('btn-right').addEventListener('touchstart', e => { e.preventDefault(); pressRight(); });

        document.getElementById('btn-up').addEventListener('mousedown', pressUp);
        document.getElementById('btn-down').addEventListener('mousedown', pressDown);
        document.getElementById('btn-left').addEventListener('mousedown', pressLeft);
        document.getElementById('btn-right').addEventListener('mousedown', pressRight);

        // Свайпы
        let touchStartX = 0, touchStartY = 0;
        document.addEventListener('touchstart', e => { 
            if(e.target.classList.contains('dpad-btn')) return;
            touchStartX = e.changedTouches[0].screenX; 
            touchStartY = e.changedTouches[0].screenY; 
        }, {passive: false});

        document.addEventListener('touchend', e => {
            if(e.target.classList.contains('dpad-btn')) return;
            let diffX = e.changedTouches[0].screenX - touchStartX;
            let diffY = e.changedTouches[0].screenY - touchStartY;
            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 20 && dx === 0) { nextDx = 1; nextDy = 0; }
                else if (diffX < -20 && dx === 0) { nextDx = -1; nextDy = 0; }
            } else {
                if (diffY > 20 && dy === 0) { nextDx = 0; nextDy = 1; }
                else if (diffY < -20 && dy === 0) { nextDx = 0; nextDy = -1; }
            }
        }, {passive: false});

        updateUI();
        generateFood();
        generateObstacles();
        draw();
        gameLoop = setInterval(update, speed);
    </script>
</body>
</html>
